name: Smoke Test

# Fits and predicts with the base v2 model and every bundled wide checkpoint on
# CPU, and records attention maps. Downloads the v2 base weights from
# HuggingFace, so it is kept out of the release gate (see release.yaml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  pytest-slow:
    runs-on: ubuntu-latest
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        run: uv python install 3.11
      - name: Install package + pytest
        run: |
          uv venv
          uv pip install -e . pytest
      - name: Run smoke tests
        run: uv run --no-sync pytest tests -m slow -v
